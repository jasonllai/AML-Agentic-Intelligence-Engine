[project]
name = "aml-agentic-workbench-backend"
version = "0.1.0"
description = "Backend foundation for a governed AML Agentic Intelligence Workbench."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.18",
    "redis>=5.0.4",
    "langgraph>=0.2.0",
    "opentelemetry-api>=1.24.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "torch>=2.0.0",
    "shap>=0.45.0",
    "numba>=0.62.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
