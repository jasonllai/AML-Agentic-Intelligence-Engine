services:
  api:
    build:
      context: ./aml_agentic_workbench/backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://aml:aml@postgres:5432/aml_workbench}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-change-me-for-local-development}
      TRACING_PROVIDER: ${TRACING_PROVIDER:-none}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      PHOENIX_ENDPOINT: ${PHOENIX_ENDPOINT:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      MOCK_LLM_MODEL: ${MOCK_LLM_MODEL:-mock-aml-llm}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./aml_agentic_workbench/backend/app:/app/app

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aml_workbench
      POSTGRES_USER: aml
      POSTGRES_PASSWORD: aml
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aml -d aml_workbench"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
